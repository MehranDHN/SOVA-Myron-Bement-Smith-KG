# Shared Islamic Archives control vocabulary
# ==========================================
# Manual, high-confidence terms for every sub-collection (FSA.A.04,
# FSA.A.06, and later siblings). Edit this file, then:
#
#   python -m pipeline.cli vocab
#
# That parse is idempotent: the same id or label always mints the same
# kg: URI and the same SKOS triples in data/rdf/vocabulary.ttl.
# `reconcile` and `map` also apply the seed. Adding a row never duplicates
# an existing concept; it merges on id, label, or exact authority IRI.
#
# Authorities (shorthand keys are exactMatch):
#   aat, tgn, lcsh, lcnaf, wikidata, iconclass, uri
#
# SKOS — intra-scheme (this file, kg: concepts)
#   broader / narrower  skos:broader / skos:narrower
#   related             skos:related
#   Values are local ids or labels of other rows in this file.
#
# SKOS — mapping (external AAT / TGN / LCSH / LCNAF / Wikidata / Iconclass)
#   exact / exactMatch       skos:exactMatch   same meaning, other scheme
#   close / closeMatch       skos:closeMatch   nearly the same, not identity
#   broadMatch / broaderMatch  skos:broadMatch this concept is narrower than
#                            an EXTERNAL concept (parent is not in this seed)
#   narrowMatch              skos:narrowMatch
#   relatedMatch             skos:relatedMatch associative, other scheme
#
# skos:broader vs skos:broadMatch
#   broader     = parent is another row in this seed (same ConceptScheme).
#   broadMatch  = parent exists only in AAT/LCSH/… and is not minted locally.
#   Do not write aat_broader when you can point `broader:` at a local id.
#   Legacy `aat_broader` / `aat_related` are read as broadMatch / relatedMatch.
#
# Optional: id, prefLabel, altLabels, note, collections.

